name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The check:* scripts import .ts files under Node's built-in type stripping, which needs
      # Node 22.18 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # No AWS credentials needed: the build reads nothing from the backend.
      - run: npm run build
      - run: npm run check:smoothing
      - run: npm run check:citations
      - run: npm run check:example-questions
